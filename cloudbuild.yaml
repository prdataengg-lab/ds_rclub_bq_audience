options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # -------------------------------------------------------------------
  # 1. Build Docker image (from repo root)
  # -------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t', 'asia-south2-docker.pkg.dev/$PROJECT_ID/rclub-bq-audience/rclub-bq-audience:$COMMIT_SHA',
        '.'
      ]
    id: Build

  # -------------------------------------------------------------------
  # 2. Push image to Artifact Registry
  # -------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'asia-south2-docker.pkg.dev/$PROJECT_ID/rclub-bq-audience/rclub-bq-audience:$COMMIT_SHA'
      ]
    id: Push

  # -------------------------------------------------------------------
  # 3A. Deploy / Update Rajnigandha Cloud Run JOB
  # -------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - rajnigandha-audience-job
      - '--image=asia-south2-docker.pkg.dev/$PROJECT_ID/rclub-bq-audience/rclub-bq-audience:$COMMIT_SHA'
      - '--region=asia-south2'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--max-retries=1'
      - '--task-timeout=3600'
      # ---------------- DEFAULT RUNTIME ARGS ----------------
      - '--args=--brand,rajnigandha'
    id: Deploy-Rajnigandha

  # -------------------------------------------------------------------
  # 3B. Deploy / Update RClub Cloud Run JOB
  # -------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - rclub-audience-job
      - '--image=asia-south2-docker.pkg.dev/$PROJECT_ID/rclub-bq-audience/rclub-bq-audience:$COMMIT_SHA'
      - '--region=asia-south2'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--max-retries=1'
      - '--task-timeout=3600'
      # ---------------- DEFAULT RUNTIME ARGS ----------------
      - '--args=--brand,rclub'
    id: Deploy-RClub

images:
  - 'asia-south2-docker.pkg.dev/$PROJECT_ID/rclub-bq-audience/rclub-bq-audience:$COMMIT_SHA'